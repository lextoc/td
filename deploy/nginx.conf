server {
 listen 80;
 listen [::]:80;
 server_name td.alexanderclaes.com;
 location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://td.alexanderclaes.com$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name td.alexanderclaes.com;
 ssl_certificate /etc/letsencrypt/live/td.alexanderclaes.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/td.alexanderclaes.com/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 root /var/www/td-static/current;
 index index.html;
 add_header Cache-Control no-cache always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location ~ /\. { deny all; }
 location / { try_files $uri $uri/ =404; }
}
